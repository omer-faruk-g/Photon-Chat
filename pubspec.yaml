name: photon_chat
description: "Photon Chat (KNK) - FIP tabanlı, telefon numarası gerektirmeyen mesajlaşma uygulaması"
publish_to: 'none'
version: 10.6.0+4

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  http: ^1.2.0
  crypto: ^3.0.3
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ">=0.13.1 <1.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
  # Marka fontları (SIL OFL 1.1, bkz. assets/fonts/OFL.txt)
  fonts:
    - family: YoungSerif
      fonts:
        - asset: assets/fonts/YoungSerif-Regular.ttf
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 700
    # Flutter web, yazı tipi belirtilmemiş metinler için "Roboto"yu Google'dan indirir.
    # Bu adı gövde fontumuza yönlendirerek açılışta Google'a istek gitmesini önlüyoruz.
    - family: Roboto
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600

# Tek kaynaktan Android/iOS/Windows/Linux/macOS/Web icon üretimi.
# Çalıştırmak için: flutter pub get && flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  adaptive_icon_background: "#0B0E0F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
