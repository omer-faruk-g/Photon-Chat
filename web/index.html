<!DOCTYPE html>
<html lang="tr">
<head>
  <!-- flutter build web --base-href ile değiştirilir (GitHub Pages: /Photon-Chat/app/) -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Photon Chat web sürümü: telefon numarası ve hesap olmadan, 5 haneli kodla uçtan uca şifreli mesajlaşma.">
  <meta name="theme-color" content="#0B0E0F">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Photon Chat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Photon Chat</title>
  <style>
    /* Uygulama yüklenene kadar görünen ekran: uygulamanın koyu zemini ve marka işareti */
    html, body { margin: 0; height: 100%; background: #0B0E0F; }
    #loader {
      position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; justify-items: center;
      color: #9DB3AC; font: 500 13px/1.5 "IBM Plex Sans", system-ui, sans-serif; letter-spacing: .04em;
      transition: opacity .2s ease;
    }
    #loader .mark { width: 48px; height: 48px; border-radius: 6px; background: #3DDC97; display: grid; place-items: center; }
    #loader .bar { width: 96px; height: 3px; background: #23352D; overflow: hidden; border-radius: 2px; }
    #loader .bar::after { content: ""; display: block; width: 32px; height: 100%; background: #3DDC97; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-32px); } to { transform: translateX(96px); } }
    @media (prefers-reduced-motion: reduce) { #loader .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#06251A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 19.1a10 10 0 0 1 0-14.2"/><path d="M7.8 16.2a6 6 0 0 1 0-8.4"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4"/><path d="M19.1 4.9a10 10 0 0 1 0 14.2"/></svg>
    </div>
    <div class="bar" aria-hidden="true"></div>
    <span>Photon Chat açılıyor</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loader');
      if (l) { l.style.opacity = '0'; setTimeout(function () { l.remove(); }, 250); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
