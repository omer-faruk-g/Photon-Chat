services:
  - type: web
    name: photon-chat-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 3000
      # Katman/animasyon vermek için yönetici anahtarı (en az 24 karakter).
      # Tanımlı değilse /tier/grant ve /anim/grant tamamen kapalıdır.
      # Render dashboard > Environment > ADMIN_TOKEN
      - key: ADMIN_TOKEN
        sync: false
      # Opsiyonel: Pulse AI icin Anthropic API anahtari
      # Render dashboard > Environment > ANTHROPIC_API_KEY olarak ekle
