name: Pages

# main'e her birleştirmede tanıtım sitesini (site/) ve web uygulamasını (Flutter web)
# derleyip gh-pages dalına yayınlar: https://<kullanıcı>.github.io/<repo>/ ve /<repo>/app/
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # build.yml ile aynı: güncel stable
          channel: 'stable'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Yayından önce reponun kendi kontrolleri (build.yml'deki verify işiyle aynı)
      - name: Statik kontroller ve sunucu testleri
        run: |
          node tool/verify.js
          cd server && npm install --no-audit --no-fund && cd ..
          node tool/server_test.js
      - run: flutter pub get
      - name: Web uygulamasını derle
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/app/"
      - name: Yayın klasörünü hazırla
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp -r build/web _site/app
          touch _site/.nojekyll
          # Web uygulaması açılışta dış sunucuya istek atmamalı (CanvasKit yerel)
          grep -q 'canvasKitBaseUrl: "canvaskit/"' _site/app/flutter_bootstrap.js
          test -f _site/app/canvaskit/canvaskit.wasm
      - name: gh-pages dalına yayınla
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Yayın: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
